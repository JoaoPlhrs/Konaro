<?xml version="1.0" encoding="UTF-8"?>
<!-- Konaro OS — papel de parede padrão (arte original do projeto). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <radialGradient id="a"><stop offset="0" stop-color="#3a3a3c" stop-opacity="0.9"/><stop offset="1" stop-color="#3a3a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="b"><stop offset="0" stop-color="#000000" stop-opacity="0.8"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
    <radialGradient id="c"><stop offset="0" stop-color="#2c2c2e" stop-opacity="0.7"/><stop offset="1" stop-color="#2c2c2e" stop-opacity="0"/></radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <ellipse cx="2850" cy="620" rx="1500" ry="950" fill="url(#a)"/>
  <ellipse cx="850" cy="1800" rx="1700" ry="850" fill="url(#b)"/>
  <ellipse cx="2350" cy="1550" rx="1000" ry="620" fill="url(#c)"/>
  <g fill="none" stroke="#636366" stroke-width="3" opacity="0.5">
    <path d="M-100 1500 C 800 1180, 1500 1900, 2400 1420 S 3600 900, 3950 1150"/>
    <path d="M-100 1580 C 820 1270, 1520 1980, 2420 1500 S 3620 990, 3950 1240" opacity="0.6"/>
    <path d="M-100 1660 C 840 1360, 1540 2060, 2440 1580 S 3640 1080, 3950 1330" opacity="0.35"/>
  </g>
  <rect width="3840" height="2160" filter="url(#grain)" opacity="0.035"/>
</svg>
