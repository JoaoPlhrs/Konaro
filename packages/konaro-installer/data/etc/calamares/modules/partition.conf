# Konaro OS — particionamento.
# Btrfs é o padrão: permite o "Voltar no tempo" (pontos de restauração do Timeshift
# com os subvolumes @ e @home). Ext4 e XFS continuam disponíveis no modo manual.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: small

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]
