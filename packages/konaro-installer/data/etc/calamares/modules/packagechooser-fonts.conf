# Konaro OS — página "Fonte" do instalador.
# Todas as fontes já estão na imagem; o módulo `konarofonts` grava a escolhida
# como padrão do sistema instalado (todos os usuários e a tela de login).
---
mode: required
method: legacy
labels:
    step: "Font"
    step[pt_BR]: "Fonte"
default: inter
items:
    - id: inter
      name: "Inter"
      description: "Clean and modern, very close to the macOS system font. Recommended."
      description[pt_BR]: "Limpa e moderna, muito parecida com a fonte do macOS. Recomendada."
      screenshot: "/usr/share/konaro/installer/font-inter.png"
    - id: noto
      name: "Noto Sans"
      description: "Friendly and very readable, KDE's standard font. Covers almost every language."
      description[pt_BR]: "Amigável e muito legível, a fonte padrão do KDE. Cobre quase todos os idiomas."
      screenshot: "/usr/share/konaro/installer/font-noto.png"
    - id: manrope
      name: "Manrope"
      description: "Geometric and contemporary, with a touch of personality."
      description[pt_BR]: "Geométrica e contemporânea, com um toque de personalidade."
      screenshot: "/usr/share/konaro/installer/font-manrope.png"
    - id: roboto
      name: "Roboto"
      description: "Familiar from Android and many websites; compact and neutral."
      description[pt_BR]: "Conhecida do Android e de muitos sites; compacta e neutra."
      screenshot: "/usr/share/konaro/installer/font-roboto.png"
