# Konaro OS — página "Navegadores" do instalador.
# Os três navegadores já estão na imagem; o que não for escolhido é removido do
# sistema instalado pelo módulo `konarobrowsers` (funciona sem internet).
# O primeiro escolhido (nesta ordem) vira o navegador padrão.
---
mode: requiredmultiple
method: legacy
labels:
    step: "Browsers"
    step[pt_BR]: "Navegadores"
items:
    - id: firefox
      name: "Firefox"
      description: "Fast, private browser from Mozilla. Free software, developed by a non-profit."
      description[pt_BR]: "Navegador rápido e privado da Mozilla. Software livre, desenvolvido por uma organização sem fins lucrativos."
      screenshot: "/usr/share/konaro/installer/browser-firefox.png"
    - id: brave
      name: "Brave"
      description: "Chromium-based browser that blocks ads and trackers by default. Updated from Brave's official repository."
      description[pt_BR]: "Navegador baseado no Chromium que bloqueia anúncios e rastreadores por padrão. Atualizado pelo repositório oficial do Brave."
      screenshot: "/usr/share/konaro/installer/browser-brave.png"
    - id: ungoogled
      name: "Ungoogled Chromium"
      description: "Chromium without Google services or data sent to Google. Installed as a Flatpak (isolated) from Flathub."
      description[pt_BR]: "Chromium sem os serviços do Google e sem envio de dados ao Google. Instalado como Flatpak (isolado) pelo Flathub."
      screenshot: "/usr/share/konaro/installer/browser-ungoogled.png"
